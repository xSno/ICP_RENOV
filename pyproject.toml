[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "icp-renov-contracts"
version = "0.1.0"
description = "Application locale de gestion des contrats ICP Renov"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

