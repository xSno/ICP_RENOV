[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "icp-renov-contracts"
version = "1.0.0"
description = "Application locale de gestion des contrats ICP Renov"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
packaging = [
  "PyInstaller==6.22.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icp_renov_contracts = [
  "resources/FIELD_TEMPLATE_CONTRACT_V1_1.txt",
  "ui/assets/*.svg",
  "ui_web/*.html",
  "ui_web/*.js",
  "ui_web/*.css",
]

