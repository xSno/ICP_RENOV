<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Prototype UX global V1.2 consolidé du générateur local de contrats d’entretien ICP Renov.">
    <title>ICP Renov — Contrats d’entretien — Prototype UX V1.2</title>
    <style>:root {
  --ink: #18252f;
  --muted: #66737d;
  --muted-2: #8a959d;
  --line: #dce2e6;
  --line-strong: #c9d2d8;
  --surface: #ffffff;
  --surface-soft: #f6f8f9;
  --surface-tint: #eef4f4;
  --canvas: #edf1f3;
  --nav: #162a33;
  --nav-hover: #203b46;
  --brand: #1e6670;
  --brand-dark: #174f57;
  --brand-soft: #e4f0f0;
  --success: #2e6d52;
  --success-soft: #eaf4ee;
  --warning: #94621d;
  --warning-soft: #fff4de;
  --danger: #a33d3d;
  --danger-soft: #fcecec;
  --info: #346681;
  --info-soft: #e9f2f7;
  --shadow: 0 12px 34px rgba(23, 42, 51, 0.09);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--canvas);
  color: var(--ink);
}

body {
  font-family: var(--font-geist-sans), Arial, Helvetica, sans-serif;
  font-size: 14px;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  color: inherit;
}

button,
select,
input[type="checkbox"],
input[type="radio"] {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(30, 102, 112, 0.18);
  outline-offset: 1px;
}

h1,
h2,
h3,
p,
dl,
dd,
dt {
  margin: 0;
}

svg {
  flex: 0 0 auto;
}

.prototype-root {
  min-width: 1120px;
  min-height: 100vh;
  background: var(--canvas);
}

.review-bar {
  height: 42px;
  padding: 0 18px;
  background: #102129;
  color: #f3f7f8;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255, 255, 255, 0.09);
}

.review-mark,
.scenario-select {
  display: flex;
  align-items: center;
}

.review-mark {
  gap: 12px;
}

.review-mark span {
  font-weight: 690;
  letter-spacing: -0.01em;
}

.review-mark small {
  color: #aabac1;
  border-left: 1px solid #38505a;
  padding-left: 12px;
}

.scenario-select {
  position: relative;
  gap: 9px;
  color: #b9c5ca;
  font-size: 12px;
}

.scenario-select select {
  appearance: none;
  min-width: 238px;
  height: 29px;
  padding: 0 28px 0 10px;
  border: 1px solid #38505a;
  border-radius: 6px;
  background: #1a3039;
  color: #f4f7f8;
  font-size: 12px;
}

.scenario-select svg {
  position: absolute;
  right: 8px;
  pointer-events: none;
}

.app-shell {
  height: calc(100vh - 42px);
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  overflow: hidden;
}

.sidebar {
  height: 100%;
  padding: 20px 13px 14px;
  background: var(--nav);
  color: #eaf0f2;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #28404a;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 2px 9px 22px;
}

.brand-icon {
  width: 37px;
  height: 37px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  color: #ffffff;
  background: #2c7780;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}

.brand > span:last-child,
.setup-brand > span:last-child {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.brand strong,
.setup-brand strong {
  font-size: 15px;
  letter-spacing: -0.015em;
}

.brand small,
.setup-brand small {
  font-size: 11px;
  color: #aab9bf;
}

.sidebar nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nav-item {
  width: 100%;
  height: 42px;
  padding: 0 11px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: #becbd0;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 590;
  text-align: left;
}

.nav-item:hover {
  background: var(--nav-hover);
  color: #ffffff;
}

.nav-item.active {
  background: #284650;
  color: #ffffff;
  box-shadow: inset 3px 0 0 #68aab0;
}

.sidebar-spacer {
  flex: 1;
}

.local-state {
  margin: 0 2px 12px;
  padding: 12px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.local-state div,
.backup-state span {
  display: flex;
  align-items: center;
  gap: 7px;
}

.local-state strong {
  font-size: 12px;
}

.local-state p {
  margin-top: 6px;
  color: #9fb0b7;
  font-size: 11px;
  line-height: 1.45;
}

.backup-state {
  padding: 10px 10px 12px;
  border-top: 1px solid #2a424c;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.backup-state span {
  color: #92a6ae;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.045em;
}

.backup-state strong {
  font-size: 11px;
  font-weight: 570;
  color: #dbe4e7;
}

.sidebar-version {
  padding: 8px 10px 0;
  color: #738b94;
  font-size: 10px;
}

.app-main {
  min-width: 0;
  height: 100%;
  overflow: auto;
  background: #f3f5f6;
}

.app-main > .notice {
  margin: 18px 28px 0;
}

.screen {
  width: 100%;
  max-width: 1580px;
  margin: 0 auto;
  padding: 28px 30px 42px;
}

.screen-header {
  min-height: 76px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}

.screen-header h1,
.contract-title-row h1,
.setup-steps h1 {
  margin-top: 3px;
  color: #152730;
  font-size: 28px;
  line-height: 1.15;
  letter-spacing: -0.035em;
  font-weight: 720;
}

.screen-header p,
.contract-title-row p,
.setup-steps > p {
  margin-top: 6px;
  color: var(--muted);
  line-height: 1.55;
}

.eyebrow {
  color: #6c7b83;
  font-size: 10px;
  font-weight: 720;
  text-transform: uppercase;
  letter-spacing: 0.09em;
}

.button {
  min-height: 36px;
  padding: 0 13px;
  border: 1px solid transparent;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
  transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
}

.button-primary {
  background: var(--brand);
  border-color: var(--brand);
  color: #ffffff;
  box-shadow: 0 1px 1px rgba(18, 66, 72, 0.2);
}

.button-primary:hover {
  background: var(--brand-dark);
  border-color: var(--brand-dark);
}

.button-secondary {
  background: #ffffff;
  border-color: var(--line-strong);
  color: #31434d;
}

.button-secondary:hover {
  border-color: #99aab3;
  background: #f8fafb;
}

.button-ghost {
  padding-inline: 8px;
  background: transparent;
  border-color: transparent;
  color: var(--brand);
}

.button-ghost:hover {
  background: var(--brand-soft);
}

.button-danger {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}

.button:disabled {
  cursor: not-allowed;
  opacity: 0.48;
}

.icon-button,
.table-action {
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #60717a;
}

.icon-button:hover,
.table-action:hover {
  color: var(--ink);
  border-color: #a6b4bb;
  background: #f8fafb;
}

.table-action {
  width: 29px;
  height: 29px;
  border-color: transparent;
  background: transparent;
}

.attention-line {
  min-height: 56px;
  margin: 12px 0 18px;
  padding: 9px 13px;
  border: 1px solid #cbd8da;
  border-radius: 8px;
  background: #eef5f5;
  display: flex;
  align-items: center;
  gap: 16px;
}

.attention-title,
.backup-reminder {
  display: flex;
  align-items: center;
  gap: 9px;
}

.attention-title > svg {
  color: var(--brand);
}

.attention-title span {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.attention-title strong {
  font-size: 12px;
}

.attention-title small,
.backup-reminder {
  color: #607179;
  font-size: 11px;
}

.attention-line > button,
.backup-reminder button {
  border: 0;
  background: transparent;
  color: var(--brand);
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 650;
}

.attention-divider {
  width: 1px;
  height: 28px;
  margin-left: auto;
  background: #cbd8da;
}

.toolbar {
  min-height: 48px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.search-box {
  width: min(410px, 38vw);
  height: 38px;
  padding: 0 11px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #78868d;
}

.search-box:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(30, 102, 112, 0.1);
}

.search-box input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
}

.filter-tabs {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #e9edef;
}

.filter-tabs button {
  height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #66757d;
  font-size: 11px;
  font-weight: 610;
}

.filter-tabs button.active {
  background: #ffffff;
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(20, 36, 44, 0.1);
}

.table-shell {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
}

.table-shell table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.table-shell th {
  height: 39px;
  padding: 0 12px;
  background: #f2f5f6;
  border-bottom: 1px solid var(--line);
  color: #6f7d84;
  font-size: 10px;
  font-weight: 720;
  text-align: left;
  text-transform: uppercase;
  letter-spacing: 0.045em;
}

.table-shell td {
  padding: 12px;
  border-bottom: 1px solid #e7ebed;
  color: #344650;
  font-size: 12px;
  vertical-align: middle;
}

.table-shell tbody tr:last-child td {
  border-bottom: 0;
}

.contracts-table tbody tr {
  cursor: pointer;
}

.contracts-table tbody tr:hover {
  background: #f8fbfb;
}

.contracts-table th:nth-child(1) { width: 14%; }
.contracts-table th:nth-child(2) { width: 18%; }
.contracts-table th:nth-child(3) { width: 9%; }
.contracts-table th:nth-child(4) { width: 16%; }
.contracts-table th:nth-child(5) { width: 22%; }
.contracts-table th:nth-child(6) { width: 15%; }
.contracts-table th:nth-child(7) { width: 36px; }

.table-shell td strong,
.table-shell td small {
  display: block;
}

.table-shell td strong {
  color: #253842;
  font-weight: 660;
}

.table-shell td small {
  margin-top: 4px;
  color: #7b8990;
  font-size: 10px;
  line-height: 1.35;
}

.table-shell td small svg {
  display: inline;
  margin-right: 3px;
  vertical-align: -2px;
}

.contract-number {
  color: var(--brand) !important;
}

.status,
.template-state,
.mini-label,
.count-label {
  min-height: 23px;
  padding: 3px 8px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}

.status-brouillon {
  background: #edf0f2;
  color: #5d6a71;
}

.status-a-signer {
  background: var(--warning-soft);
  color: #875a1a;
}

.status-signe,
.status-actif {
  background: var(--success-soft);
  color: var(--success);
}

.status-resilie,
.status-expire,
.status-abandonne {
  background: #eff1f2;
  color: #67737a;
}

.action-text {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  line-height: 1.4;
}

.action-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: currentColor;
}

.action-warning { color: #8b601f; }
.action-danger { color: var(--danger); }
.action-info { color: var(--info); }
.action-none { color: #7a888f; }

.document-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #738087;
  font-size: 11px;
}

.document-state.ok { color: var(--success); }
.row-chevron { color: #97a3a9; }

.empty-state {
  padding: 48px;
  display: flex;
  align-items: center;
  flex-direction: column;
  color: #7a888f;
}

.empty-state h3 {
  margin-top: 10px;
  color: var(--ink);
}

.empty-state p {
  margin-top: 4px;
  font-size: 12px;
}

.notice {
  min-height: 58px;
  padding: 11px 13px;
  border: 1px solid;
  border-radius: 7px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.notice-copy {
  flex: 1;
}

.notice strong {
  display: block;
  margin-bottom: 3px;
  font-size: 12px;
}

.notice p {
  color: inherit;
  opacity: 0.86;
  font-size: 11px;
  line-height: 1.45;
}

.notice-action {
  align-self: center;
}

.notice-info {
  background: var(--info-soft);
  border-color: #c7dde8;
  color: #315f77;
}

.notice-success {
  background: var(--success-soft);
  border-color: #c8dfd1;
  color: var(--success);
}

.notice-warning {
  background: var(--warning-soft);
  border-color: #ead5ab;
  color: #835a20;
}

.notice-danger {
  background: var(--danger-soft);
  border-color: #edc7c7;
  color: #963c3c;
}

.contract-screen {
  padding-top: 20px;
}

.contract-header {
  margin-bottom: 17px;
}

.back-button {
  height: 30px;
  padding: 0;
  border: 0;
  background: transparent;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #65747c;
  font-size: 11px;
  font-weight: 620;
}

.back-button:hover { color: var(--brand); }

.contract-title-row {
  margin-top: 5px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
}

.contract-heading-meta {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #718087;
  font-size: 11px;
}

.contract-title-row h1 {
  margin-top: 7px;
}

.contract-title-row p {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}

.header-actions,
.revision-actions,
.terminal-actions > div,
.client-detail-header > div:last-child {
  display: flex;
  align-items: center;
  gap: 7px;
}

.save-state {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #64747c;
  font-size: 11px;
}

.contract-screen > .notice {
  margin-bottom: 13px;
}

.contract-tabs {
  height: 50px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px 8px 0 0;
  background: #ffffff;
  display: flex;
  align-items: stretch;
  gap: 4px;
}

.contract-tabs button {
  position: relative;
  padding: 0 14px;
  border: 0;
  background: transparent;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #6b7880;
  font-size: 11px;
  font-weight: 630;
}

.contract-tabs button.active {
  color: var(--brand);
}

.contract-tabs button.active::after {
  content: "";
  position: absolute;
  right: 10px;
  bottom: -1px;
  left: 10px;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: var(--brand);
}

.step-check {
  width: 18px;
  height: 18px;
  border: 1px solid #cdd5d9;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.contract-tabs button.active .step-check {
  border-color: var(--brand);
}

.contract-tabs button.active .step-check span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
}

.contract-body {
  min-height: 680px;
  padding: 20px;
  border: 1px solid var(--line);
  border-top: 0;
  border-radius: 0 0 8px 8px;
  background: #eef1f2;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 18px;
}

.contract-content {
  min-width: 0;
}

.content-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.panel {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
}

.section-heading {
  margin-bottom: 15px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
}

.section-heading h2 {
  color: #21343e;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.015em;
}

.section-heading p {
  max-width: 720px;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.45;
}

.selected-record {
  min-height: 76px;
  padding: 12px;
  border: 1px solid #d4dcdf;
  border-radius: 7px;
  background: #fafcfc;
  display: flex;
  align-items: center;
  gap: 11px;
}

.record-icon {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: var(--brand-soft);
  color: var(--brand);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.selected-record > div {
  flex: 1;
}

.selected-record strong {
  font-size: 13px;
}

.selected-record p,
.selected-record small {
  margin-top: 3px;
  color: #66757d;
  font-size: 11px;
}

.selected-record small {
  color: #869198;
}

.snapshot-note {
  margin-top: 10px;
  display: flex;
  align-items: flex-start;
  gap: 6px;
  color: #748189;
  font-size: 10px;
  line-height: 1.45;
}

.compact-table th:first-child,
.compact-table td:first-child {
  width: 40px;
  text-align: center;
}

.compact-table th:last-child,
.compact-table td:last-child {
  width: 44px;
}

.compact-table th:nth-child(2) { width: 25%; }
.compact-table th:nth-child(3) { width: 25%; }

input[type="checkbox"],
input[type="radio"] {
  width: 15px;
  height: 15px;
  margin: 0;
  accent-color: var(--brand);
}

.form-footer {
  min-height: 50px;
  padding: 12px 2px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.contract-summary {
  position: sticky;
  top: 0;
  align-self: start;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
}

.contract-summary h3 {
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}

.contract-summary dl {
  padding: 6px 0 10px;
}

.contract-summary dl div {
  padding: 9px 0;
  border-bottom: 1px solid #edf0f2;
}

.contract-summary dt {
  color: #7d8990;
  font-size: 9px;
  font-weight: 690;
  text-transform: uppercase;
  letter-spacing: 0.045em;
}

.contract-summary dd {
  margin-top: 3px;
  color: #2f424c;
  font-size: 11px;
  font-weight: 610;
  line-height: 1.4;
}

.summary-readiness {
  padding: 11px;
  border-radius: 6px;
